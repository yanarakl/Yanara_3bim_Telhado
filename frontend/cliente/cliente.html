<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Cliente</title>
    <link rel="stylesheet" href="../base.css">
    <link rel="stylesheet" href="cliente.css">
</head>

<body onload="listar()">
    <header>
        <h3>Telhado</h3>
        <p>Cadastro de Cliente</p>
        <section>
            <nav>
                <button onclick="abrirCategoria()">Categorias</button>
                <button onclick="abrirProduto()">Produtos</button>
                <button onclick="abrirPedido()">Pedidos</button>
                <button onclick="abrirPagamento()">Pagamentos</button>
                <button onclick="abrirFuncionario()">Funcionários</button>
                <button onclick="abrirMenu()">Menu</button>

            </nav>
        </section>
    </header>
    <main>
        <section>
            <h4>Dados do Cliente</h4>
            <label for="inputId_Cliente">Id_Cliente</label>
            <div class="linha-id">
                <input type="number" name="inputId_Cliente" id="inputId_Cliente" placeholder="Ex: 1" min="1">
                <input type="button" value="Procure" id="btProcure" onclick="procure()">
                <input type="button" value="Inserir" id="btInserir" onclick="inserir()" style="display:none;">
                <input type="button" value="Alterar" id="btAlterar" onclick="alterar()" style="display:none;">
                <input type="button" value="Excluir" id="btExcluir" onclick="excluir()" style="display:none;">
            </div>

            <label for="inputNome_Cliente">Nome</label>
            <input type="text" name="inputNome_Cliente" id="inputNome_Cliente">

            <label for="inputTelefone_Cliente">Telefone</label>
            <input type="text" name="inputTelefone_Cliente" id="inputTelefone_Cliente">

            <label for="inputEmail_Cliente">E-mail</label>
            <input type="email" name="inputEmail_Cliente" id="inputEmail_Cliente">

            <div id="divAviso">Informe o ID e clique em Procure</div>

            <input type="button" value="Salvar" id="btSalvar" onclick="salvar()" style="display:none;">
            <input type="button" value="Cancelar" id="btCancelar" onclick="cancelarOperacao()" style="display:none;">
        </section>
        <section>
            <h4>Clientes Cadastrados:</h4>
            <div id="outputSaida">Carregando...</div>
        </section>
    </main>
    <footer>
        <p>Yanara Karczetski de Lima — M32A — 2026</p>
    </footer>
    <script src="cliente.js"></script>
</body>

</html>
